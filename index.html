    --bg-dark: #000000;
    --text-grey: #8a94a6;

* { box-sizing: border-box; }

body {
    margin: 0;
    background-color: var(--bg-dark);
    font-family: 'Inter', sans-serif;
    color: white;
    overflow-x: hidden;
    overflow-y: scroll;
    scroll-behavior: smooth;
}

::selection { background: var(--purple); color: #fff; }

#particle-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

#site-content { position: relative; z-index: 1; }

.hud-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    background: rgba(8, 4, 16, 0.8);

    top: 0;
    left: 0;
    right: 0;
    z-index: 100;

}

.nav-logo {

    font-weight: 100;

    color: white;

}
.nav-logo span { color: var(--purple-bright); font-weight: 400; }
.nav-logo:hover { text-shadow: 0 0 15px var(--purple); cursor: pointer; }

.nav-right { display: flex; align-items: center; gap: 10px; }

/* Bubble navbar: links sit inside a track with a sliding highlight pill. */
.nav-right { position: relative; }

.nav-bubble {
    position: relative;
    display: flex;
    align-items: center;
    height: 44px;
    padding: 4px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(var(--purple-rgb), 0.06);
}

.nav-bubble-indicator {
    position: absolute;
    top: 4px;
    left: 0;
    height: calc(100% - 8px);
    border-radius: 999px;
    background: rgba(var(--purple-rgb), 0.22);
    border: 1px solid rgba(var(--purple-rgb), 0.55);
    box-shadow: 0 0 18px rgba(var(--purple-rgb), 0.35), inset 0 0 12px rgba(var(--purple-rgb), 0.25);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    z-index: 0;
    opacity: 0;
}

.nav-bubble-indicator.visible { opacity: 1; }

.nav-bubble .nav-item {
    position: relative;
    z-index: 1;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--text-grey);
    white-space: nowrap;
}

.nav-bubble .nav-item:hover { color: white; }
.nav-bubble .nav-item.active { color: var(--purple-neon); text-shadow: 0 0 12px rgba(var(--purple-rgb), 0.8); }


.nav-item {
    text-decoration: none;
    color: white;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 4px;
    transition: 0.3s;
    padding: 10px 20px;
    cursor: pointer;
}
.nav-item:hover { color: var(--purple-neon); }
.nav-item.active { color: var(--purple-bright); text-shadow: 0 0 12px rgba(var(--purple-rgb), 0.8); }

.content-container {
    max-width: 1400px;
    margin: 130px auto 0;
    padding: 0 40px 40px;
}

.page-title {
    font-weight: 300;
    letter-spacing: 4px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-top: 20px;
    text-transform: uppercase;
}

.section-title {
    font-weight: 300;
    letter-spacing: 4px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-top: 40px;
    text-transform: uppercase;
    color: white;
}

.hero-banner {
    position: relative;
    min-height: 65vh;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    border: 1px solid var(--line);
}

.hero-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center top;
    filter: brightness(0.75);
    z-index: 0;
}

.hero-fade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, #000 5%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.15) 100%);
    z-index: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
    padding: 40px;
    max-width: 720px;
}

.hero-tag {
    color: var(--purple-neon);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 0.85rem;
}

.hero-title {
    font-size: 3.2rem;
    font-weight: 400;
    margin: 0 0 10px;
    line-height: 1.1;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
}

.hero-meta {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    color: var(--text-grey);
}
.hero-meta .gold { color: var(--warning-gold); }

.hero-desc {
    color: #ccc;
    line-height: 1.6;
    margin: 0 0 25px;
    max-width: 640px;
}

.back-link {
    display: inline-block;
    margin-bottom: 20px;
    background: none;
    border: none;
    color: var(--text-grey);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 300;
    letter-spacing: 5px;
    text-decoration: none;
    text-transform: uppercase;
    transition: 0.3s;
}
.back-link:hover {
    color: var(--purple-neon);
    letter-spacing: 7px;
}

.btn-action {
    background: var(--purple);
    color: white;
    border: 1px solid var(--purple-bright);
    padding: 12px 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
    display: inline-block;
}
.btn-action:hover {
    background: var(--purple-deep);
    box-shadow: 0 0 25px rgba(var(--purple-rgb), 0.55);
    text-shadow: 0 0 8px #fff;
}

.btn-secondary {
    background: rgba(var(--purple-rgb), 0.08);
    color: white;
    border: 1px solid var(--line);
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.25s;
}
.btn-secondary:hover {
    border-color: var(--purple-bright);
    color: var(--purple-neon);
    box-shadow: 0 0 12px rgba(var(--purple-rgb), 0.35);
}

.tv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.strip-scroll {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 165px;
    gap: 18px;
    overflow-x: auto;
    padding: 10px 2px 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--purple) rgba(255,255,255,0.05);
}
.strip-scroll::-webkit-scrollbar { height: 6px; }
.strip-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
.strip-scroll::-webkit-scrollbar-thumb { background: var(--purple); }

.poster-card {
    display: block;
    position: relative;
    border: 1px solid rgba(var(--purple-rgb), 0.18);
    background: #0a0a0a;
    transition: 0.3s ease;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
}

.poster-card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
}

.poster-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(var(--purple-rgb), 0.18), transparent 55%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
}

.poster-card:hover {
    border-color: var(--purple-bright);
    box-shadow: 0 0 22px rgba(var(--purple-rgb), 0.45);
    transform: translateY(-4px);
}
.poster-card:hover img { transform: scale(1.06); }
.poster-card:hover::after { opacity: 1; }

.section-title.toned {
    font-size: 1rem;
    color: var(--text-grey);
    letter-spacing: 3px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    margin-top: 35px;
}

.rec-grid {
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 12px;
    margin-top: 15px;
}

.rec-grid .poster-card { border-color: rgba(var(--purple-rgb), 0.1); }

.content-section { margin: 10px 0 30px; }

.section-heading {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 4px;
    color: var(--purple-neon);
    border-left: 3px solid var(--purple);
    padding-left: 12px;
    margin: 26px 0 16px;
}

.cw-card { position: relative; }

.cw-remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border: 1px solid rgba(var(--purple-rgb), 0.6);
    background: rgba(0, 0, 0, 0.8);
    color: var(--purple-neon);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
}

.cw-card:hover .cw-remove { opacity: 1; }

.cw-remove:hover { background: var(--purple); color: #ffffff; }

.rec-grid .poster-card:hover {
    box-shadow: 0 0 10px rgba(var(--purple-rgb), 0.25);
    transform: translateY(-2px);
    border-color: rgba(var(--purple-rgb), 0.35);
}

.rec-grid .poster-card:hover::after { opacity: 0; }

.ad-warning {
    border: 1px solid rgba(255, 193, 7, 0.35);
    background: rgba(255, 193, 7, 0.06);
    color: var(--warning-gold);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 1px;
    padding: 12px 18px;
    margin: 20px 0;
    line-height: 1.7;
}
.ad-warning a, .ad-warning .ad-link { color: var(--purple-neon); text-decoration: underline; cursor: pointer; }

.details-layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 30px;
}

.details-layout.movie-layout {
    grid-template-columns: 1fr;
}
.details-layout.movie-layout .video-container {
    padding-top: 56.25%;
    max-height: 80vh;
}

.video-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
    border: 1px solid var(--line);
}

.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

.player-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.server-select-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
}

.server-select-label {
    color: var(--text-grey);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    white-space: nowrap;
}

.server-select {
    background: #0d0817;
    color: white;
    border: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 1px;
    padding: 7px 10px;
    cursor: pointer;
    transition: 0.25s;
    max-width: 190px;
}
.server-select option { background: #0d0817; }

.server-select:hover,
.server-select:focus {
    border-color: var(--purple-bright);
    box-shadow: 0 0 8px rgba(var(--purple-rgb), 0.3);
    outline: none;
}

.episode-list-container {
    border: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    max-height: 640px;
}

.season-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    font-size: 0.8rem;
}

.season-select {
    background: #0d0817;
    color: white;
    border: 1px solid var(--purple);
    font-family: 'JetBrains Mono', monospace;
    padding: 6px 10px;
    cursor: pointer;
}
.season-select option { background: #0d0817; }

.episodes-scroll { overflow-y: auto; flex: 1; }

.episode-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: 0.2s;
}
.episode-item:hover { background: rgba(var(--purple-rgb), 0.12); }
.episode-item.active { background: rgba(var(--purple-rgb), 0.2); border-left: 3px solid var(--purple-bright); }

.ep-num {
    font-family: 'JetBrains Mono', monospace;
    color: var(--purple-bright);
    font-size: 0.9rem;
    min-width: 28px;
}
.ep-title {
    font-size: 0.82rem;
    color: #ccc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.show-info { margin-top: 30px; }
.show-type-tag {
    color: var(--purple-bright);

    letter-spacing: 2px;

.show-title { font-size: 2.6rem; font-weight: 400; margin: 0 0 8px; line-height: 1.15; }

    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
}
.show-meta .gold { color: var(--warning-gold); }
.show-desc { color: #ccc; line-height: 1.7; max-width: 900px; margin-top: 12px; }

.site-footer {
    margin: 40px 0 0;
    width: 100%;
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(2px);
}

.site-footer-inner {
    min-height: 82px;
    padding: 14px 40px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 18px;
}

.site-footer-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-self: start;
}

.footer-logo {

    font-weight: 100;
    letter-spacing: 6px;
    color: white;
}
.footer-logo span { color: var(--purple-bright); font-weight: 400; }

.site-footer-links {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    justify-self: center;
}

.site-footer-links a, .site-footer-links .footer-link {
    color: var(--purple-bright);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
}
.site-footer-links a:hover, .site-footer-links .footer-link:hover { color: var(--purple-neon); }
.site-footer-links .sep { color: var(--text-grey); }

.instance-host {
    justify-self: end;
    text-align: right;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 300;
    color: var(--text-grey);
    letter-spacing: 4px;
}
.instance-host span { color: var(--purple-neon); }

.instance-host.instance-host-link { cursor: pointer; }

.instance-host.instance-host-link:hover span {
    text-shadow: 0 0 10px rgba(var(--purple-rgb), 0.8);
}

.instance-host.instance-host-link:hover {
    color: var(--purple-bright);
}

@media (max-width: 900px) {
    .details-layout { grid-template-columns: 1fr; }
    .hud-nav { padding: 15px 20px; }
    .nav-right { padding-right: 0; }
    .nav-item { padding: 8px 10px; letter-spacing: 2px; }
    .content-container { padding: 0 20px 30px; margin-top: 110px; }
    .hero-title { font-size: 2.2rem; }
    .show-title { font-size: 1.8rem; }
    .site-footer-inner { grid-template-columns: 1fr; padding: 14px 20px; justify-items: center; row-gap: 10px; }
    .site-footer-brand, .site-footer-links, .instance-host { justify-self: center; text-align: center; }
}


/* ============ LIVE SPORTS ============ */

.sport-match-list { display: flex; flex-direction: column; gap: 10px; }

.match-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(var(--purple-rgb), 0.05);
    cursor: pointer;
    transition: border-color 0.25s, background 0.25s;
}

.match-row:hover { border-color: var(--purple); background: rgba(var(--purple-rgb), 0.12); }
.match-row.active { border-color: var(--purple-bright); background: rgba(var(--purple-rgb), 0.16); }

.match-teams { flex: 1; min-width: 0; }

.match-team-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.92rem;
    color: #e5e5e5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.match-team-line img { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }

.match-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-grey);
    text-align: right;
    line-height: 1.5;
    flex-shrink: 0;
}

.match-live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 8px #ff3b3b;
    margin-right: 6px;
    animation: livePulse 1.6s infinite;
}

@keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}

.match-row.is-live .match-time { color: #ff6b6b; }

.ls-match-info { margin-top: 25px; }

.ls-match-headline {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
}

.ls-match-headline img { width: 40px; height: 40px; object-fit: contain; }

.ls-match-title { margin: 0; font-size: 1.6rem; font-weight: 400; letter-spacing: 1px; }

.ls-match-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-grey);
    margin-top: 8px;
}

@media (max-width: 900px) {
    .nav-bubble .nav-item { padding: 8px 14px; letter-spacing: 2px; }
}

function normalizeHexColor(hex) {
    if (!hex) return null;
    const match = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!match) return null;
    let short = match[1];
    if (short.length === 3) {
        short = short[0] + short[0] + short[1] + short[1] + short[2] + short[2];
    }
    return '#' + short.toLowerCase();
}

function applyColorScheme(hex) {
    const color = normalizeHexColor(hex);
    if (!color || color === DEFAULT_COLOR_SCHEME.toLowerCase()) return;
    const r = parseInt(color.slice(1, 3), 16);
    const g = parseInt(color.slice(3, 5), 16);
    const b = parseInt(color.slice(5, 7), 16);
    const mix = function (channel, target, t) { return Math.round(channel + (target - channel) * t); };
    const bright = 'rgb(' + mix(r, 255, 0.35) + ', ' + mix(g, 255, 0.35) + ', ' + mix(b, 255, 0.35) + ')';
    const neon = 'rgb(' + mix(r, 255, 0.6) + ', ' + mix(g, 255, 0.6) + ', ' + mix(b, 255, 0.6) + ')';
    const deep = 'rgb(' + mix(r, 0, 0.3) + ', ' + mix(g, 0, 0.3) + ', ' + mix(b, 0, 0.3) + ')';
    const root = document.documentElement;
    root.style.setProperty('--purple', color);
    root.style.setProperty('--purple-rgb', r + ', ' + g + ', ' + b);
    root.style.setProperty('--purple-bright', bright);
    root.style.setProperty('--purple-neon', neon);
    root.style.setProperty('--purple-deep', deep);
    window.__veridiumRgb = [r, g, b];

const HISTORY_KEY = 'veridium_history';

// Storage probe with fallbacks so Continue Watching survives contexts where
// localStorage is unavailable (sandboxed embeds, blob windows, strict privacy).
const historyStorage = (function () {
    function probe(store) {
        try {
            const k = '__veridium_probe__';
            store.setItem(k, '1');
            store.removeItem(k);
            return store;
        } catch (err) {
            return null;
        }
    }
    function cookieStore() {
        const store = {
            isCookie: true,
            getItem: function (key) {
                try {
                    const m = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
                    return m ? decodeURIComponent(m[1]) : null;
                } catch (err) {
                    return null;
                }
            },
            setItem: function (key, value) {
                try {
                    document.cookie = key + '=' + encodeURIComponent(value) + ';path=/;max-age=31536000;SameSite=Lax';
                } catch (err) { }
            },
            removeItem: function (key) {
                try {
                    document.cookie = key + '=;path=/;max-age=0';
                } catch (err) { }
            }
        };
        return probe(store);
    }
    try {
        return probe(window.localStorage) || probe(window.sessionStorage) || cookieStore();
    } catch (err) {
        return null;
    }
})();
const HISTORY_LIMIT = 7;

function loadHistory() {
    if (!historyStorage) return [];
    try {
        const raw = historyStorage.getItem(HISTORY_KEY);
        const list = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(list)) return [];
        return list
            .map(function (e) {
                if (!e) return null;
                const id = Number(e.id);
                const type = e.type === 'movie' ? 'movie' : (e.type === 'tv' ? 'tv' : null);
                if (!id || !type) return null;
                const isTv = type === 'tv';
                return {
                    id: id,
                    type: type,
                    title: typeof e.title === 'string' ? e.title : '',
                    poster: (typeof e.poster === 'string' && e.poster) ? e.poster : POSTER_FALLBACK,
                    genres: Array.isArray(e.genres)
                        ? e.genres.map(function (g) { return Number(g); }).filter(function (g) { return g > 0; })
                        : [],
                    season: isTv ? (Number(e.season) || null) : null,
                    episode: isTv ? (Number(e.episode) || null) : null,
                    ts: Number(e.ts) || 0
                };
            })
            .filter(function (e) { return e !== null; });
    } catch (err) {
        return [];
    }
}

function saveHistoryList(list) {
    if (!historyStorage) return;
    const limit = historyStorage.isCookie ? 4 : HISTORY_LIMIT;
    try {
        historyStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, limit)));
    } catch (err) {
        // Cookie size overflow: keep shrinking until it fits.
        for (var n = limit - 1; n > 0; n--) {
            try {
                historyStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, n)));
                return;
            } catch (err2) { }
        }
    }
}

function recordWatch(show, season, episode) {
    const isTv = show.type === 'tv';
    const existing = loadHistory().find(function (e) {
        return e.id === Number(show.id) && e.type === show.type;
    });
    let finalSeason = Number(season) || null;
    let finalEpisode = Number(episode) || null;
    if (isTv) {
        if (!finalSeason) finalSeason = existing ? existing.season : null;
        if (!finalEpisode) finalEpisode = existing ? existing.episode : null;
        finalSeason = finalSeason || 1;
        finalEpisode = finalEpisode || 1;
    } else {
        finalSeason = null;
        finalEpisode = null;
    }
    const entry = {
        id: Number(show.id),
        type: show.type,
        title: show.title || (existing ? existing.title : ''),
        poster: show.poster || (existing ? existing.poster : POSTER_FALLBACK),
        genres: (Array.isArray(show.genres) && show.genres.length)
            ? show.genres.slice()
            : (existing ? existing.genres : []),
        season: finalSeason,
        episode: finalEpisode,
        ts: Date.now()
    };
    const list = loadHistory().filter(function (e) {
        return !(e.id === entry.id && e.type === entry.type);
    });
    list.unshift(entry);
    saveHistoryList(list);
}

function updateWatchEpisode(id, type, season, episode) {
    const list = loadHistory();
    const entry = list.find(function (e) { return e.id === Number(id) && e.type === type; });
    if (entry) {
        if (type === 'tv') {
            if (season) entry.season = Number(season);
            if (episode) entry.episode = Number(episode);
        }
        entry.ts = Date.now();
        saveHistoryList(list);
    }
}

function removeWatch(id, type) {

const TV_ONLY_GENRE_IDS = [10759, 10762, 10763, 10764, 10765, 10766, 10767, 10768];
const MOVIE_ONLY_GENRE_IDS = [28, 12, 14, 27, 36, 53, 878, 10402, 10749, 10752];

function genresForType(genreIds, type) {
    const exclude = type === 'movie' ? TV_ONLY_GENRE_IDS : MOVIE_ONLY_GENRE_IDS;
    return (genreIds || []).filter(function (g) {
        return exclude.indexOf(Number(g)) === -1;
    });
}

async function backfillHistoryGenres(history) {
    const missing = history.filter(function (e) { return !e.genres || !e.genres.length; });
    if (!missing.length) return history;
    const details = await Promise.all(missing.map(function (e) {
        return ShowService.getDetails(e.id, e.type).catch(function () { return null; });
    }));
    const list = loadHistory();
    let changed = false;
    details.forEach(function (d, i) {
        const target = missing[i];
        const entry = list.find(function (x) { return x.id === target.id && x.type === target.type; });
        if (!entry) return;
        if (d && Array.isArray(d.genres) && d.genres.length) {
            entry.genres = d.genres.slice();
            changed = true;
        }
        if ((!entry.poster || entry.poster === POSTER_FALLBACK) && d && d.poster) {
            entry.poster = d.poster;
            changed = true;
        }
        if (!entry.title && d && d.title) {
            entry.title = d.title;
            changed = true;
        }
    });
    if (changed) saveHistoryList(list);
    return loadHistory();
}

async function fetchHomeRecommended(history) {
    history = await backfillHistoryGenres(history);
    const counts = {};
    history.forEach(e => (e.genres || []).forEach(g => { counts[g] = (counts[g] || 0) + 1; }));
    const topGenres = Object.keys(counts)
        .map(Number)
        .sort((a, b) => counts[b] - counts[a])
        .slice(0, 2);
    const watched = new Set(history.map(e => e.type + ':' + e.id));
    const pool = [];
    const push = function (item) {
        if (!item) return;
        if (watched.has(item.type + ':' + item.id)) return;
        if (pool.some(p => p.id === item.id && p.type === item.type)) return;
        pool.push(item);
    };
    const requests = [];
    const requestTypes = [];
    ['tv', 'movie'].forEach(function (t) {
        const genreList = genresForType(topGenres, t);
        if (!genreList.length) return;
        requestTypes.push(t);
        requests.push(
            fetch(TMDB_BASE + '/discover/' + t + '?api_key=' + TMDB_API_KEY +
                    '&sort_by=popularity.desc&with_genres=' + genreList.join('|') +
                    '&vote_count.gte=50&page=1')
                .then(r => r.json())
                .catch(function () { return {}; })
        );
    });
    const results = await Promise.all(requests);
    results.forEach(function (res, idx) {
        const type = requestTypes[idx];
        (res.results || []).forEach(function (raw) {
            push(normalizeTMDB(Object.assign({}, raw, { media_type: type })));
        });
    });
    if (pool.length < 7) {
        try {
            const trending = await ShowService.fetchTrending();
            trending.forEach(push);
        } catch (err) { }
    }
    return shuffleList(pool).slice(0, 7);
}

async function initShow(id, type, seasonParam, episodeParam) {
    type = type === 'movie' ? 'movie' : 'tv';
    seasonParam = seasonParam != null ? parseInt(seasonParam, 10) : null;
    episodeParam = episodeParam != null ? parseInt(episodeParam, 10) : null;

    const layout = document.getElementById('show-root');
    if (!id) {
        layout.innerHTML = '<div class="ad-warning">No show specified. <span class="ad-link" data-go-home>Back to home</span></div>';
        return;
    }

    layout.innerHTML = '<div class="ad-warning">ACCESSING DATA...</div>';

    try {
        await loadServers();
        const show = await ShowService.getDetails(id, type);
        if (!show) {
            layout.innerHTML = '<div class="ad-warning">Show not found. <span class="ad-link" data-go-home>Back to home</span></div>';
            return;
        }
        state.show = show;

        // Where to start: explicit URL params win, then saved progress, then S1E1.
        const saved = loadHistory().find(function (e) {
            return e.id === Number(show.id) && e.type === type;
        });
        const totalSeasons = show.totalSeasons || 1;
        let startSeason = null;
        if (seasonParam && seasonParam >= 1 && seasonParam <= totalSeasons) {
            startSeason = seasonParam;
        } else if (saved && saved.season && saved.season >= 1 && saved.season <= totalSeasons) {
            startSeason = saved.season;
        }
        startSeason = startSeason || 1;
        state.season = startSeason;
        state.episode = null;

        if (type === 'tv') {
            const eps = await ShowService.getSeasonEpisodes(id, startSeason);
            show.episodes[startSeason] = eps;
            let startEpisode = null;
            if (episodeParam && episodeParam >= 1) {
                startEpisode = eps.find(function (e) { return e.number === episodeParam; }) || null;
            }
            if (!startEpisode && saved && saved.season === startSeason && saved.episode) {
                startEpisode = eps.find(function (e) { return e.number === saved.episode; }) || null;
            }
            state.episode = startEpisode || eps[0] || { number: 1, title: 'Unavailable' };
        }

        renderShowPage();
        document.title = show.title + ' - Veridium';
        recordWatch(
            show,
            type === 'tv' ? state.season : null,
            type === 'tv' && state.episode ? state.episode.number : null
        );
        renderRecommended(id, type);
    } catch (err) {
        layout.innerHTML = '<div class="ad-warning">DATA CORRUPTED. RETRY.</div>';
    }
}

function initParticles() {
    try {
        const canvas = document.getElementById('particle-canvas');
        if (!canvas || !canvas.getContext) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let width = 0, height = 0;
        const particles = [];
        const mouse = { x: -9999, y: -9999 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function spawn() {
            particles.length = 0;
            const count = Math.min(90, Math.floor(window.innerWidth / 18));
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 1.8 + 0.6
                });
            }
        }

        function step() {
            ctx.clearRect(0, 0, width, height);
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0) p.x = width; else if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height; else if (p.y > height) p.y = 0;

                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const distSq = dx * dx + dy * dy;
                if (distSq < 12000) {
                    const dist = Math.sqrt(distSq) || 1;
                    const push = (12000 - distSq) / 12000;
                    p.x += (dx / dist) * push * 3;
                    p.y += (dy / dist) * push * 3;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                const particleRgb = window.__veridiumRgb || [139, 92, 246];
                ctx.fillStyle = 'rgba(' + particleRgb[0] + ', ' + particleRgb[1] + ', ' + particleRgb[2] + ', 0.5)';
                ctx.fill();
            }
            requestAnimationFrame(step);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', function (e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        resize();
        spawn();
        step();
    } catch (err) {
        
    }
}

// All former pages live in the same document as .page-view containers.
// Navigation swaps the visible view in place of loading a new page.

const PAGE_VIEWS = ['home', 'popular', 'featured', 'show', 'livesports'];
const PAGE_TITLES = {
    home: 'Veridium',
    popular: 'Popular - Veridium',
    featured: 'Featured - Veridium',
    show: 'Player - Veridium',
    livesports: 'Live Sports - Veridium'
};

function showView(name) {
    if (PAGE_VIEWS.indexOf(name) === -1) name = 'home';
    document.body.setAttribute('data-page', name);
    PAGE_VIEWS.forEach(function (view) {
        const el = document.getElementById('view-' + view);
        if (el) el.style.display = (view === name) ? '' : 'none';
    });
    if (PAGE_TITLES[name]) document.title = PAGE_TITLES[name];
    renderNavbar();
    window.scrollTo(0, 0);
    if (name === 'home') initHome();
    else if (name === 'popular') initPopular();
    else if (name === 'featured') initFeatured();
    else if (name === 'livesports') initLiveSports();
}

function goHome() {
    showView('home');
}

function openShow(id, type, season, episode) {
    if (!id) return;
    showView('show');
    initShow(id, type, season, episode);
    window.scrollTo(0, 0);
}

// ONE-PAGE BUILD: one delegated click handler covers every former anchor
// (logo, nav items, poster cards, hero button, back links, footer links).
function wireInteractions() {
    const logo = document.getElementById('nav-logo');
    if (logo) logo.addEventListener('click', function () { goHome(); });

    document.addEventListener('click', function (e) {
        if (!e.target || !e.target.closest) return;

        const opener = e.target.closest('[data-show-id]');
        if (opener) {
            e.preventDefault();
            openShow(
                parseInt(opener.getAttribute('data-show-id'), 10),
                opener.getAttribute('data-show-type'),
                opener.hasAttribute('data-season') ? parseInt(opener.getAttribute('data-season'), 10) : null,
                opener.hasAttribute('data-episode') ? parseInt(opener.getAttribute('data-episode'), 10) : null
            );
            return;
        }

        const nav = e.target.closest('[data-nav-page]');
        if (nav) {
            e.preventDefault();
            showView(nav.getAttribute('data-nav-page'));
            return;
        }

        if (e.target.closest('[data-go-home]')) {
            e.preventDefault();
            goHome();
            return;
        }

        const ext = e.target.closest('[data-external]');
        if (ext) {
            e.preventDefault();
            window.open(ext.getAttribute('data-external'), '_blank', 'noopener,noreferrer');
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        if (!e.target || !e.target.closest || e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
        const el = e.target.closest('[data-show-id], [data-nav-page], [data-go-home], [data-external]');
        if (!el) return;
        e.preventDefault();
        el.click();
    });
}

document.addEventListener('DOMContentLoaded', function () {
    initParticles();
    loadHostData().then(applyHostData);
    renderNavbar();
    wireInteractions();
    showView('home');
});

window.addEventListener('pageshow', function (event) {
    if (event.persisted && document.body.getAttribute('data-page') === 'home') {
        initHome();
    }
});

// ============ NAVBAR (bubble layout, driven by instance-host-data.js) ============

const NAV_ITEMS = {
    'Popular': { page: 'popular' },
    'Featured': { page: 'featured' },
    'Live Sports': { page: 'livesports' }
};
const NAV_DEFAULT_LAYOUT = ['Popular', 'Featured', 'Live Sports'];

function renderNavbar() {
    const navRight = document.getElementById('nav-right');
    if (!navRight) return;
    const raw = (window.VERIDIUM_HOST_DATA && Array.isArray(window.VERIDIUM_HOST_DATA.navbarLayout))
        ? window.VERIDIUM_HOST_DATA.navbarLayout
        : NAV_DEFAULT_LAYOUT;
    const layout = raw.filter(function (name) {
        return typeof name === 'string' && Object.prototype.hasOwnProperty.call(NAV_ITEMS, name.trim());
    }).map(function (name) { return name.trim(); });

    const currentPage = document.body.getAttribute('data-page');
    navRight.innerHTML = '';

    const bubble = document.createElement('div');
    bubble.className = 'nav-bubble';
    const indicator = document.createElement('div');
    indicator.className = 'nav-bubble-indicator';
    bubble.appendChild(indicator);

    const links = [];
    layout.forEach(function (name) {
        const item = NAV_ITEMS[name];
        const el = document.createElement('div');
        el.className = 'nav-item' + (currentPage === item.page ? ' active' : '');
        el.setAttribute('data-nav-page', item.page);
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.textContent = name.toUpperCase();
        bubble.appendChild(el);
        links.push(el);
    });
    navRight.appendChild(bubble);

    const activeEl = bubble.querySelector('.nav-item.active');
    function moveIndicator(el) {
        if (!el) {
            indicator.classList.remove('visible');
            return;
        }
        indicator.classList.add('visible');
        indicator.style.width = el.offsetWidth + 'px';
        indicator.style.transform = 'translateX(' + el.offsetLeft + 'px)';
    }
    links.forEach(function (el) {
        el.addEventListener('mouseenter', function () { moveIndicator(el); });
    });
    bubble.addEventListener('mouseleave', function () { moveIndicator(activeEl); });
    function settle() { moveIndicator(activeEl); }
    window.addEventListener('load', settle);
    window.addEventListener('resize', settle);
    requestAnimationFrame(function () { setTimeout(settle, 80); });
}

// ============ LIVE SPORTS (streamed.pk) ============

const STREAMED_API = 'https://streamed.pk/api';
const lsState = { sports: [], matches: [], sportId: 'live', match: null, streams: [], streamIndex: 0 };

function lsFetchJSON(url) {
    return fetch(url).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    });
}

function lsBadgeUrl(id) {
    return STREAMED_API + '/images/badge/' + encodeURIComponent(id) + '.webp';
}

function lsEscape(value) { return escapeHtml(value); }

function lsFormatTime(ts) {
    const d = new Date(Number(ts));
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

async function initLiveSports() {
    const root = document.getElementById('livesports-root');
    if (!root) return;
    root.innerHTML = '<div class="ad-warning">ACCESSING DATA...</div>';
    try {
        const sports = await lsFetchJSON(STREAMED_API + '/sports');
        lsState.sports = (Array.isArray(sports) ? sports : []).filter(function (sp) { return sp && sp.id && sp.name; });
    } catch (err) {
        lsState.sports = [];
    }
    lsState.match = null;
    lsState.streams = [];
    renderLiveSportsPage();
    loadMatches(lsState.sportId);
}

function renderLiveSportsPage() {
    const root = document.getElementById('livesports-root');
    if (!root) return;

    const sportOptions = '<option value="live"' + (lsState.sportId === 'live' ? ' selected' : '') + '>LIVE NOW</option>' +
        lsState.sports.map(function (sp) {
            return '<option value="' + lsEscape(sp.id) + '"' + (lsState.sportId === sp.id ? ' selected' : '') + '>' + lsEscape(sp.name.toUpperCase()) + '</option>';
        }).join('');

    root.innerHTML =
        '<div class="back-link" data-go-home role="button" tabindex="0">&lt; BACK</div>' +

        '<div class="ad-warning" style="margin-top:0;">' +
            'Live sports streams are embedded from outside sources and may include ads. ' +
            'Use an ad blocker for the best experience. ' +
            '<span class="ad-link" data-external="https://ublockorigin.com/" role="button" tabindex="0">Get uBlock Origin</span>' +
        '</div>' +

        '<div class="details-layout">' +
            '<div>' +
                '<div class="video-container">' +
                    '<iframe id="video-player" src="about:blank" frameborder="0" allowfullscreen ' +
                        'allow="autoplay; fullscreen; encrypted-media; picture-in-picture" ' +
                        'referrerpolicy="strict-origin-when-cross-origin"></iframe>' +
                '</div>' +
                '<div class="player-buttons">' +
                    '<button type="button" class="btn-secondary" onclick="playerFullscreen()">FULLSCREEN</button>' +
                    '<button type="button" class="btn-secondary" onclick="lsRefresh()">REFRESH</button>' +
                    '<button type="button" class="btn-secondary" onclick="lsOpenLink()">OPEN LINK</button>' +
                    '<div class="server-select-wrap">' +
                        '<span class="server-select-label">STREAM SELECTOR:</span>' +
                        '<select id="stream-select" class="server-select" onchange="switchLiveStream(parseInt(this.value, 10))">' +
                            '<option value="0">SELECT A MATCH</option>' +
                        '</select>' +
                    '</div>' +
                '</div>' +

                '<div id="ls-match-info" class="ls-match-info"></div>' +
            '</div>' +
            '<div class="episode-list-container">' +
                '<div class="season-header">' +
                    '<span>MATCHES</span>' +
                    '<select id="sport-select" class="season-select" onchange="changeSport(this.value)">' + sportOptions + '</select>' +
                '</div>' +
                '<div id="matches-scroll" class="episodes-scroll sport-match-list"></div>' +
            '</div>' +
        '</div>';
}

async function loadMatches(sportId) {
    lsState.sportId = sportId || 'live';
    const listEl = document.getElementById('matches-scroll');
    if (!listEl) return;
    listEl.innerHTML = '<div class="ad-warning">LOADING...</div>';
    try {
        const endpoint = lsState.sportId === 'live'
            ? '/matches/live'
            : '/matches/' + encodeURIComponent(lsState.sportId);
        const matches = await lsFetchJSON(STREAMED_API + endpoint);
        lsState.matches = Array.isArray(matches) ? matches : [];
        renderMatchList();
    } catch (err) {
        lsState.matches = [];
        listEl.innerHTML = '<div class="ad-warning">Failed to load matches. Refresh the page.</div>';
    }
}

function changeSport(sportId) {
    loadMatches(sportId);
}

function renderMatchList() {
    const listEl = document.getElementById('matches-scroll');
    if (!listEl) return;
    if (!lsState.matches.length) {
        listEl.innerHTML = '<div class="ad-warning">No matches found. Check back later.</div>';
        return;
    }
    const now = Date.now();
    const sorted = lsState.matches.slice().sort(function (a, b) { return (a.date || 0) - (b.date || 0); });
    listEl.innerHTML = sorted.map(function (m, idx) {
        const isLiveRow = lsState.sportId === 'live';
        const active = lsState.match && lsState.match.id === m.id;
        const home = m.teams && m.teams.home;
        const away = m.teams && m.teams.away;
        let teamsHtml = '';
        if (home || away) {
            teamsHtml =
                '<div class="match-team-line">' +
                    (home ? '<img src="' + lsEscape(lsBadgeUrl(home.badge)) + '" onerror="this.style.display=\'none\'">' : '') +
                    '<span>' + lsEscape(home ? home.name : '') + '</span>' +
                '</div>' +
                '<div class="match-team-line">' +
                    (away ? '<img src="' + lsEscape(lsBadgeUrl(away.badge)) + '" onerror="this.style.display=\'none\'">' : '') +
                    '<span>' + lsEscape(away ? away.name : '') + '</span>' +
                '</div>';
        } else {
            teamsHtml = '<div class="match-team-line"><span>' + lsEscape(m.title || 'Match') + '</span></div>';
        }
        return '<div class="match-row' + (isLiveRow ? ' is-live' : '') + (active ? ' active' : '') + '" onclick="selectMatch(' + idx + ')">' +
            '<div class="match-teams">' + teamsHtml + '</div>' +
            '<div class="match-time">' +
                (isLiveRow ? '<span class="match-live-dot"></span>LIVE' : lsEscape(lsFormatTime(m.date))) +
            '</div>' +
        '</div>';
    }).join('');
}

async function selectMatch(idx) {
    const match = lsState.matches[idx];
    if (!match) return;
    lsState.match = match;
    lsState.streams = [];
    lsState.streamIndex = 0;
    renderMatchList();
    renderMatchInfo(match);

    const infoEl = document.getElementById('ls-match-info');
    const selectEl = document.getElementById('stream-select');
    if (selectEl) selectEl.innerHTML = '<option value="0">LOADING STREAMS...</option>';
    setPlayerSrc('about:blank');
    if (infoEl) infoEl.insertAdjacentHTML('beforeend', '<div class="ad-warning" id="ls-stream-warning">LOADING STREAMS...</div>');

    let streams = [];
    const sources = (match.sources || []).slice();
    for (let i = 0; i < sources.length; i++) {
        try {
            const res = await lsFetchJSON(STREAMED_API + '/stream/' + encodeURIComponent(sources[i].source) + '/' + encodeURIComponent(sources[i].id));
            if (Array.isArray(res) && res.length) {
                streams = res;
                break;
            }
        } catch (err) { }
    }
    lsState.streams = streams;
    const warnEl = document.getElementById('ls-stream-warning');
    if (warnEl) warnEl.remove();

    if (selectEl) {
        if (!streams.length) {
            selectEl.innerHTML = '<option value="0">NO STREAMS</option>';
        } else {
            selectEl.innerHTML = streams.map(function (st, i) {
                return '<option value="' + i + '">STREAM ' + st.streamNo + ' - ' + lsEscape((st.language || 'UNKNOWN').toUpperCase()) + (st.hd ? ' (HD)' : '') + '</option>';
            }).join('');
        }
    }
    if (streams.length) {
        switchLiveStream(0);
    } else if (infoEl) {
        infoEl.insertAdjacentHTML('beforeend', '<div class="ad-warning">No streams available for this match yet. Try another source or check back later.</div>');
    }
}

function renderMatchInfo(match) {
    const infoEl = document.getElementById('ls-match-info');
    if (!infoEl || !match) return;
    const home = match.teams && match.teams.home;
    const away = match.teams && match.teams.away;
    const isLiveRow = lsState.sportId === 'live';
    infoEl.innerHTML =
        '<div class="ls-match-headline">' +
            (home ? '<img src="' + lsEscape(lsBadgeUrl(home.badge)) + '" onerror="this.style.display=\'none\'">' : '') +
            '<h1 class="ls-match-title">' + lsEscape(match.title || 'Live Match') + '</h1>' +
            (away ? '<img src="' + lsEscape(lsBadgeUrl(away.badge)) + '" onerror="this.style.display=\'none\'">' : '') +
        '</div>' +
        '<div class="ls-match-meta">' +
            (isLiveRow ? '<span class="match-live-dot"></span><span>LIVE</span><span>|</span>' : '') +
            '<span>' + lsEscape((match.category || '').toUpperCase()) + '</span>' +
            '<span>|</span>' +
            '<span>' + lsEscape(lsFormatTime(match.date)) + '</span>' +
        '</div>';
}

function lsCurrentEmbedUrl() {
    const st = lsState.streams[lsState.streamIndex];
    return st ? st.embedUrl : '';
}

function switchLiveStream(i) {
    lsState.streamIndex = Number(i) || 0;
    const url = lsCurrentEmbedUrl();
    if (url) setPlayerSrc(url);
}

function lsRefresh() {
    const url = lsCurrentEmbedUrl();
    if (url) setPlayerSrc(url);
}

function lsOpenLink() {
    const url = lsCurrentEmbedUrl();
    if (url) window.open(url, '_blank', 'noopener,noreferrer');
}

</script>
